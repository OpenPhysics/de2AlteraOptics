name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Bridge smoke test (simulator)
        run: |
          node server/bridge.ts --simulate --port 8787 &
          for i in $(seq 1 20); do
            curl -fs localhost:8787/api/status && break
            sleep 0.5
          done
          sleep 1
          curl -fs localhost:8787/api/status | tee status.json
          node -e "const s=require('./status.json'); if(!s.receiving||s.packets<5) process.exit(1)"
          timeout 2 curl -sN localhost:8787/stream | grep -m1 'event: packet'
          curl -fs -o /dev/null -H 'Origin: https://openphysics.github.io' \
            -D - localhost:8787/api/status | grep -i 'access-control-allow-origin'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://evil.example' localhost:8787/api/status)
          test "$code" = 403
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
